# Glowie theme (soft "clean girl" palette) and privacy-friendly settings.
# The detailed styling lives in assets/style.css.
[theme]
primaryColor = "#DC867C"              # blush: buttons, highlights
backgroundColor = "#DDE8D4"           # soft sage-tinted page
secondaryBackgroundColor = "#FFFFFF"  # white inputs / panels
textColor = "#4A3B35"                 # cocoa brown
font = "sans serif"

[client]
toolbarMode = "minimal"     # hides the Deploy button and developer menu
showSidebarNavigation = false

[server]
maxUploadSize = 15          # MB — photos larger than this are rejected

[browser]
gatherUsageStats = false    # don't send usage statistics to Streamlit
