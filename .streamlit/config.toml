# Olive Green + Warm Cream theme and privacy-friendly settings.
[theme]
primaryColor = "#68764B"
backgroundColor = "#FAF7EF"
secondaryBackgroundColor = "#E8EBDD"
textColor = "#303A2C"
font = "sans serif"

[server]
maxUploadSize = 15          # MB — photos larger than this are rejected

[browser]
gatherUsageStats = false    # don't send usage statistics to Streamlit
